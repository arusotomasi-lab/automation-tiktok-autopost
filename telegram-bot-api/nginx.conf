# Runs as root so it can read files written by the telegram-bot-api user.
user root;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  access_log /dev/stdout;
  sendfile on;
  client_max_body_size 2100m;
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;
  proxy_request_buffering off;

  server {
    listen 8080;
    listen [::]:8080;

    location = /healthz { return 200 "ok\n"; }

    # In --local mode getFile returns an absolute path inside the work dir.
    # n8n requests <base>/file/bot<TOKEN>/<file_path>; serve only files that
    # belong to that same token's folder.
    location ~ ^/file/bot(?<tok>[^/]+)/+var/lib/telegram-bot-api/(?<tok2>[^/]+)/(?<rest>.+)$ {
      if ($tok != $tok2) { return 403; }
      alias /var/lib/telegram-bot-api/$tok2/$rest;
    }

    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
